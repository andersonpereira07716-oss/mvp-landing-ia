<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Landing Page IA</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-lg w-full bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-2xl space-y-6">
    <div>
      <h1 class="text-2xl font-black text-emerald-400 flex items-center gap-2">⚡ Gerador de Landing IA</h1>
      <p class="text-xs text-slate-400 mt-1">Preencha os dados do negócio para gerar a página e o kit de marketing instantaneamente.</p>
    </div>

    <form id="formGerar" class="space-y-4">
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-1">Nome da Marca / Produto</label>
        <input type="text" id="nome" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Ex: TurboBurger">
      </div>
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-1">Descrição do Serviço</label>
        <textarea id="descricao" required rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Ex: Hambúrguer artesanal, batata frita..."></textarea>
      </div>
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-1">Público-Alvo</label>
        <input type="text" id="publico" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Ex: Jovens e famílias">
      </div>
      <div>
        <label class="block text-xs uppercase font-bold tracking-wider text-slate-400 mb-1">WhatsApp de Contato</label>
        <input type="text" id="whatsapp" required class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-emerald-500 focus:outline-none text-slate-100" placeholder="Ex: 5583998765554">
      </div>
      <button type="submit" id="btnSubmit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold p-3 rounded-lg text-sm transition cursor-pointer shadow-lg shadow-emerald-500/20">
        Gerar com IA...
      </button>
    </form>
    <div id="errorBox" class="hidden bg-red-950/50 border border-red-500/50 text-red-400 p-3 rounded-lg text-xs"></div>
  </div>

  <script>
    document.getElementById('formGerar').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      const errorBox = document.getElementById('errorBox');
      errorBox.classList.add('hidden');

      btn.disabled = true;
      btn.textContent = 'Gerando com IA... (Aguarde)';

      const payload = {
        nome: document.getElementById('nome').value.trim(),
        descricao: document.getElementById('descricao').value.trim(),
        publico: document.getElementById('publico').value.trim(),
        whatsapp: document.getElementById('whatsapp').value.trim()
      };

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 65000);

      try {
        const response = await fetch('/api/gerar', {
          method: 'POST',
          signal: ctrl.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const contentType = response.headers.get('content-type') || '';

        if (!response.ok) {
          if (contentType.includes('application/json')) {
            const errData = await response.json();
            throw new Error(errData.error || 'Erro desconhecido no servidor.');
          }
          throw new Error('O servidor demorou ou falhou (código ' + response.status + '). Tente novamente.');
        }

        const htmlResult = await response.text();
        document.open();
        document.write(htmlResult);
        document.close();
      } catch (err) {
        const msg = err.name === 'AbortError'
          ? 'Tempo esgotado. Tente novamente.'
          : err.message;
        errorBox.textContent = '❌ Erro: ' + msg;
        errorBox.classList.remove('hidden');
      } finally {
        clearTimeout(timer);
        btn.disabled = false;
        btn.textContent = 'Gerar com IA...';
      }
    });
  </script>
</body>
</html>
